[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "uae-compliance-rag"
version = "0.1.0"
description = "UAE Regulatory Compliance RAG Agent"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.3",
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "pydantic>=2.7.0",
    "groq>=0.9.0",
    "instructor>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
